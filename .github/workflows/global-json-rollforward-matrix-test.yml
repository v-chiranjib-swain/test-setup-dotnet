name: global.json rollForward matrix test (official semantics vs check-latest:false)

# Reference: https://learn.microsoft.com/en-us/dotnet/core/tools/global-json#rollforward
# Each job encodes the *official* documented behavior for one 'rollForward'
# value as a comment, builds a fixture matching it, then checks whether
# setup-dotnet's check-latest:false local-reuse path picks the version the
# real 'dotnet' muxer would pick. Network is blocked throughout, so any
# success can only come from local reuse, and any 'falls back online' means
# the local path either isn't implemented for that value, or correctly
# rejected the fixture.
#
# Pinned to v-mahabaleshwars/setup-dotnet@be40b433: the PR's latest commit,
# which addresses the latestMajor/latestMinor local-reuse gap AND rewrites
# rollForward matching so legacy 'patch'/'feature'/'minor'/'major' values
# roll forward to the nearest higher band locally too (previously exact-pin-only).

on:
  workflow_dispatch:

env:
  BLOCKED_HTTPS_PROXY: http://127.0.0.1:1
  BLOCKED_HTTP_PROXY: http://127.0.0.1:1

jobs:
  # --- latestPatch (official doc example) ---
  # "Uses the latest installed patch level that matches the requested major,
  # minor, and feature band with a patch level >= the specified value. If not
  # found, fails." Doc example: version 8.0.102 -> allows 8.0.102.. within
  # the same 1xx band, e.g. 8.0.103 or 8.0.199.
  latestPatch:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (8.0.100 below floor, 8.0.199 above floor, same 1xx band)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.100" "$fixture/sdk/8.0.199"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.0.100/dotnet.dll" "$fixture/sdk/8.0.199/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.102","rollForward":"latestPatch"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:latestPatch (offline)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 8.0.199 was reused (highest patch in-band, >= floor)
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "8.0.199" ]; then
            echo "Expected local reuse of 8.0.199, got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK: latestPatch correctly reused the highest in-band patch >= floor"

  # --- latestFeature (official doc example) ---
  # "Uses the highest installed feature band and patch level that matches the
  # requested major and minor with a feature band+patch >= the specified
  # value. If not found, fails." Doc example: version 8.0.302 -> allows
  # 8.0.302.. across any feature band, e.g. 8.0.303 or 8.0.402.
  latestFeature:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (8.0.300 below floor, 8.0.402 above floor, different band)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.300" "$fixture/sdk/8.0.402"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.0.300/dotnet.dll" "$fixture/sdk/8.0.402/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.302","rollForward":"latestFeature"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:latestFeature (offline)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 8.0.402 was reused (highest feature band, >= floor)
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "8.0.402" ]; then
            echo "Expected local reuse of 8.0.402, got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK: latestFeature correctly reused the highest feature band >= floor"

  # --- latestMinor ---
  # "Uses the highest installed minor, feature band, and patch level that
  # matches the requested major with minor+band+patch >= the specified
  # value. If not found, fails."
  # setup-dotnet widens this to the bare major ('8'), which internally maps
  # through channelForMajor() to major.minor '8.0' - constraining minor to
  # exactly 0. This sub-case checks the common (minor=0) path; the second
  # step checks whether a fixture with a genuinely higher minor (8.1.x) would
  # also be picked, per the official 'any minor >= floor' semantics.
  latestMinor:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (8.0.050 below floor, 8.0.200 above floor, same minor)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.050" "$fixture/sdk/8.0.200"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.0.050/dotnet.dll" "$fixture/sdk/8.0.200/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestMinor"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:latestMinor, same-minor fixture (offline)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 8.0.200 was reused
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "8.0.200" ]; then
            echo "Expected local reuse of 8.0.200, got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK: latestMinor reused the highest same-minor candidate >= floor"

  latestMinor-higher-minor-gap:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (only 8.1.100 installed - a genuinely higher minor, still >= floor)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.1.100"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.1.100/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestMinor"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:latestMinor, higher-minor-only fixture (offline, gap now fixed - expect success)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 8.1.100 IS now reused (minor-constraint gap fixed)
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "8.1.100" ]; then
            echo "Expected local reuse of 8.1.100, got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK (fix confirmed): a higher-minor SDK satisfying the official 'latestMinor' rule is now reused locally"

  # --- latestMajor (official doc example) ---
  # "Uses the highest installed .NET SDK with a version that's >= the
  # specified value. If not found, fail." Doc example: version 7.0.200 ->
  # allows 7.0.200 or any later version, including 8.0.xxx.
  latestMajor:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (9.0.423 - a higher major, satisfies the floor per official docs)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/9.0.423"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/9.0.423/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"7.0.200","rollForward":"latestMajor"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:latestMajor (offline, gap now fixed - expect success)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 9.0.423 IS now reused (latestMajor gap fixed)
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "9.0.423" ]; then
            echo "Expected local reuse of 9.0.423, got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK (fix confirmed): a higher-major SDK satisfying the official 'latestMajor' rule is now reused locally"

  # --- disable (official doc example) ---
  # "Doesn't roll forward; an exact match is required."
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (exact 8.0.302 installed)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.302"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.0.302/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.302","rollForward":"disable"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:disable, exact match present (offline)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert exact 8.0.302 was reused
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "8.0.302" ]; then
            echo "Expected local reuse of the exact 8.0.302, got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK: disable correctly reused only the exact declared version"

  disable-no-exact-match:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (only a newer patch, 8.0.303, no exact 8.0.302)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.303"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.0.303/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.302","rollForward":"disable"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:disable, no exact match (offline, expect failure)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 8.0.303 is correctly rejected (disable requires an exact match)
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "Expected failure (disable must not roll forward to 8.0.303), outcome was '${{ steps.run.outcome }}'"; exit 1
          fi
          echo "OK: disable correctly refused to substitute a newer patch"

  # --- patch / feature / minor / major (legacy, non-'latest'-prefixed values) ---
  # 'version' still stays the literal declared sdk.version for all four (no
  # widening like the 'latest*' values), but findByRollForward() now scopes
  # candidates to the same feature band ('patch') and picks the highest
  # match in-band if the exact one is missing - matching the official
  # 'patch' roll-forward semantics rather than requiring an exact pin.
  legacy-patch-value-pinned-behavior:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (8.0.105 installed, NOT the exact declared 8.0.100, same patch band)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.105"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.0.105/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.100","rollForward":"patch"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:patch, no exact match (offline, gap now fixed - expect success)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 8.0.105 IS now reused (legacy 'patch' now rolls forward within its band)
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "8.0.105" ]; then
            echo "Expected local reuse of 8.0.105, got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK (fix confirmed): legacy 'patch' now rolls forward to the highest patch in the same band, matching official semantics"

  # --- dotnet-quality is ignored for a full A.B.C sdk.version (new in be40b43) ---
  # qualityApplies() now returns false whenever `this.version` is a valid full
  # semver, so 'dotnet-quality: preview' no longer widens the local-reuse
  # candidate filter to prerelease-only when a rollForward policy is declared
  # alongside an exact sdk.version - matching how the online resolver already
  # ignores quality for an exact version. Only a prerelease-only band is
  # installed here, so a match means quality was NOT ignored (old, wrong
  # behavior); no match (fallback online, offline failure) means it was.
  quality-ignored-for-full-sdk-version:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (only a prerelease 8.0.105-preview.1 in-band, no GA candidate)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.105-preview.1"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.0.105-preview.1/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.100","rollForward":"patch"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:patch, dotnet-quality:preview, prerelease-only fixture (offline, expect failure)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          dotnet-quality: preview
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert the prerelease-only fixture was correctly rejected (quality ignored for full sdk.version)
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "Expected failure (a full sdk.version + rollForward must require a GA candidate, ignoring dotnet-quality), outcome was '${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK (fix confirmed): dotnet-quality:preview did not widen the local match to the prerelease-only candidate"

  quality-ignored-for-full-sdk-version-ga-present:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fixture (prerelease 8.0.105-preview.1 AND GA 8.0.106 in-band)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.105-preview.1" "$fixture/sdk/8.0.106"
          touch "$fixture/dotnet" && chmod +x "$fixture/dotnet"
          touch "$fixture/sdk/8.0.105-preview.1/dotnet.dll" "$fixture/sdk/8.0.106/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.100","rollForward":"patch"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:patch, dotnet-quality:preview, GA+prerelease fixture (offline, expect GA reused)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          dotnet-quality: preview
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 8.0.106 (GA) was reused, not the prerelease 8.0.105-preview.1
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "8.0.106" ]; then
            echo "Expected local reuse of the GA 8.0.106 (quality ignored), got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK (fix confirmed): dotnet-quality:preview was ignored for the full sdk.version; the GA candidate was reused instead of the higher-numbered prerelease"

  # --- Windows coverage: hasDotnetMuxer()'s IS_WINDOWS branch skips the
  # accessSync(X_OK) executable check, relying on isFile() alone - untested
  # on a real Windows runner until now. Mirrors the latestMajor job above.
  latestMajor-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare fixture (9.0.423 - a higher major, satisfies the floor per official docs)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/9.0.423"
          touch "$fixture/dotnet.exe"
          touch "$fixture/sdk/9.0.423/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"7.0.200","rollForward":"latestMajor"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:latestMajor (offline, gap now fixed - expect success)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 9.0.423 IS now reused (latestMajor gap fixed, on Windows)
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "9.0.423" ]; then
            echo "Expected local reuse of 9.0.423, got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK: latestMajor fix also holds on windows-latest"

  quality-ignored-for-full-sdk-version-ga-present-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare fixture (prerelease 8.0.105-preview.1 AND GA 8.0.106 in-band)
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sdk/8.0.105-preview.1" "$fixture/sdk/8.0.106"
          touch "$fixture/dotnet.exe"
          touch "$fixture/sdk/8.0.105-preview.1/dotnet.dll" "$fixture/sdk/8.0.106/dotnet.dll"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"
          echo '{"sdk":{"version":"8.0.100","rollForward":"patch"}}' > "$RUNNER_TEMP/proj/global.json"
      - name: Setup dotnet via rollForward:patch, dotnet-quality:preview, GA+prerelease fixture (offline, expect GA reused)
        id: run
        continue-on-error: true
        uses: v-mahabaleshwars/setup-dotnet@37534882300ef1194fd08fd3b32401d15cd465d7
        env:
          DOTNET_INSTALL_DIR: ${{ env.FIXTURE }}
          https_proxy: ${{ env.BLOCKED_HTTPS_PROXY }}
          http_proxy: ${{ env.BLOCKED_HTTP_PROXY }}
        with:
          check-latest: false
          dotnet-quality: preview
          global-json-file: '${{ runner.temp }}/proj/global.json'
      - name: Assert 8.0.106 (GA) was reused, not the prerelease (on Windows)
        run: |
          if [ "${{ steps.run.outputs.dotnet-version }}" != "8.0.106" ]; then
            echo "Expected local reuse of the GA 8.0.106 (quality ignored), got outcome='${{ steps.run.outcome }}' output='${{ steps.run.outputs.dotnet-version }}'"; exit 1
          fi
          echo "OK: quality-ignored-for-full-sdk-version fix also holds on windows-latest"
