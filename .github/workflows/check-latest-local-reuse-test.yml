name: check-latest local SDK reuse test

on:
  workflow_dispatch:

jobs:
  test-check-latest-false:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout setup-dotnet fork branch
        uses: actions/checkout@v4
        with:
          repository: v-chiranjib-swain/setup-dotnet
          ref: feature/check-latest-local-sdk-reuse
          path: setup-dotnet-src
      - name: Clear toolcache
        shell: pwsh
        run: setup-dotnet-src/__tests__/clear-toolcache.ps1 ${{ runner.os }}
      # Oldest 9.0.1xx SDK: resolving '9.0.1xx' online would return a newer patch.
      - name: Setup dotnet 9.0.100
        uses: v-chiranjib-swain/setup-dotnet@feature/check-latest-local-sdk-reuse
        with:
          dotnet-version: '9.0.100'
      - name: Setup dotnet 9.0.1xx with check-latest false
        id: reuse
        uses: v-chiranjib-swain/setup-dotnet@feature/check-latest-local-sdk-reuse
        with:
          dotnet-version: '9.0.1xx'
          check-latest: false
      - name: Verify dotnet
        shell: pwsh
        run: |
          if ('${{ steps.reuse.outputs.dotnet-version }}' -ne '9.0.100') {
            throw "Expected 9.0.100 to be reused, got '${{ steps.reuse.outputs.dotnet-version }}'."
          }
          setup-dotnet-src/__tests__/verify-dotnet.ps1 -Patterns "^9\.0\.100$"
